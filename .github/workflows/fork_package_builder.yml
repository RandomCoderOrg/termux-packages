name: Fork package builder image

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Clone repository
      uses: actions/checkout@v7

    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      env:
        IMAGE: ghcr.io/randomcoderorg/termux-package-builder
      run: |
        docker build --tag "$IMAGE:ndk29" --tag "$IMAGE:${GITHUB_SHA::12}" scripts/
        docker push "$IMAGE:ndk29"
        docker push "$IMAGE:${GITHUB_SHA::12}"
